<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドローン飛行計画書</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#25364A">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #25364A;
      --accent-light: #EEF2E4;
      --border: #C8CEC0;
      --text: #2D3325;
      --muted: #72786B;
      --bg: #F5F3EC;
      --white: #ffffff;
      --radius: 8px;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ===== ヘッダー ===== */
    .site-header {
      background: var(--accent);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header svg { flex-shrink: 0; }
    .site-header h1 { font-size: 18px; font-weight: 700; letter-spacing: .03em; }
    .site-header a {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ===== レイアウト ===== */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: calc(100vh - 54px);
    }

    /* ===== フォームパネル ===== */
    .form-panel {
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 28px 28px 40px;
      overflow-y: auto;
    }
    .form-panel h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .field { margin-bottom: 24px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 5px;
      letter-spacing: .04em;
    }
    .field input,
    .field textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 54, 74, .15);
    }
    .field textarea {
      resize: vertical;
      min-height: 72px;
    }
    .field select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      outline: none;
    }

    /* 機体テンプレート行 */
    .tpl-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-small {
      padding: 8px 12px;
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .btn-small:hover { background: var(--accent); color: #fff; }
    .btn-small.danger { color: #8a2f2f; border-color: #8a2f2f; }
    .btn-small.danger:hover { background: #8a2f2f; color: #fff; }

    /* 保存ステータス */
    .autosave-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }

    .btn-secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-outline {
      padding: 11px;
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .15s, color .15s;
    }
    .btn-outline:hover { background: var(--accent); color: #fff; }

    .btn-next {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      background: var(--accent-light);
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, color .15s;
    }
    .btn-next:hover { background: var(--accent); color: #fff; }
    #json-file { display: none; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-print {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn-print:hover { background: #34495f; }
    .btn-print:active { transform: scale(.98); }

    /* ===== プレビューパネル ===== */
    .preview-panel {
      background: var(--bg);
      padding: 28px 28px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-panel-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 24px;
      align-self: flex-start;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    /* ===== 計画書本体 ===== */
    .doc {
      background: var(--white);
      width: 100%;
      max-width: 680px;
      padding: 40px 44px;
      box-shadow: 0 2px 16px rgba(0,0,0,.10);
      border-radius: 4px;
    }

    .doc-header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--accent);
    }
    .doc-header .doc-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
    }
    .doc-header .doc-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: .06em;
    }
    .doc-header .doc-project {
      font-size: 17px;
      font-weight: 700;
      margin-top: 14px;
      padding: 8px 16px;
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      text-align: left;
      color: var(--text);
      min-height: 36px;
    }

    .doc-section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--white);
      background: var(--accent);
      padding: 5px 12px;
      margin: 24px 0 0;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }
    .doc-table tr { border-bottom: 1px solid var(--border); }
    .doc-table tr:last-child { border-bottom: 2px solid var(--accent); }
    .doc-table th {
      width: 38%;
      padding: 9px 12px;
      background: var(--accent-light);
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      vertical-align: top;
      border-right: 2px solid var(--accent);
    }
    .doc-table td {
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      vertical-align: top;
      min-height: 34px;
    }
    .doc-table td.empty { color: var(--muted); font-style: italic; }

    .doc-footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 11px;
      color: var(--muted);
    }
    .doc-footer .sign-area {
      display: flex;
      gap: 32px;
    }
    .doc-footer .sign-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .doc-footer .sign-label { font-size: 11px; color: var(--muted); }
    .doc-footer .sign-line {
      width: 100px;
      height: 1px;
      background: var(--border);
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .form-panel {
        border-right: none;
        border-bottom: 2px solid var(--border);
        padding: 20px 16px 28px;
      }
      .preview-panel {
        padding: 20px 10px 32px;
      }
      .doc {
        padding: 24px 18px;
      }
      .field-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .form-panel {
        padding: 16px 12px 24px;
      }
      .field input[type="date"],
      .field input[type="time"] {
        padding: 6px 8px;
        line-height: 1.2;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    /* ===== 印刷 ===== */
    @media print {
      @page {
        size: A4 portrait;
        /* 余白を0にするとブラウザのヘッダー/フッター（URL・日付・ページ番号）の
           描画場所がなくなり、印刷設定に関係なく消える。
           実際の余白は .doc 側の padding(mm) で確保する */
        margin: 0;
      }

      /* 「背景のグラフィック」設定がオフでも背景色・罫線色を強制的に印刷する */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body { background: #fff; font-size: 12px; }
      .site-header,
      .form-panel,
      .preview-panel-label { display: none !important; }

      .layout { display: block; }

      .preview-panel {
        background: #fff;
        padding: 0;
        overflow: visible;
        display: block;
      }

      .doc {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
        width: 100%;
        /* @page margin:0 のぶんの紙余白をここで確保 */
        padding: 18mm 16mm 20mm;
        /* ページ途中での不自然な分割やサイン欄だけの孤立を防ぐ */
        break-inside: avoid;
      }

      .doc-table {
        /* 各テーブル単位でも改ページを制限 */
        break-inside: avoid;
      }

      .doc-header .doc-title { font-size: 20px; }
      .doc-header .doc-project { font-size: 15px; }

      .doc-table th,
      .doc-table td { font-size: 11px; padding: 7px 10px; }

      /* 万一背景色が印刷されない環境でも見出しセルと値セルの
         区別がつくよう、罫線による保険を掛けておく */
      .doc-table th { border-right: 1.5px solid var(--accent); }

      .btn-print { display: none !important; }
    }
  
    /* ===== 共通ナビ ===== */
    .site-nav {
      background: var(--accent);
      display: flex;
      gap: 4px;
      padding: 0 20px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      color: rgba(255, 255, 255, .78);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: .03em;
      transition: background .15s, color .15s;
    }
    .site-nav a:hover { color: #fff; background: rgba(255, 255, 255, .14); }
    .site-nav a[aria-current="page"] {
      background: var(--accent-light);
      color: var(--accent);
    }
    @media print { .site-nav { display: none !important; } }
    @media (max-width: 480px) {
      .site-nav { padding: 0 14px 9px; }
    }
  </style>
</head>
<body>

<header class="site-header">
</header>

<nav class="site-nav" aria-label="ツール間ナビゲーション">
  <a href="index.html">ホーム</a>
  <a href="flight-plan.html" aria-current="page">計画書</a>
  <a href="calculator.html">飛行計算</a>
  <a href="checklist.html">チェックリスト</a>
  <a href="flight-log.html">日誌</a>
  <a href="data.html">データ管理</a>
</nav>


<div class="layout">

  <section class="form-panel">
    <h2>入力フォーム</h2>

    <div class="field">
      <label for="f-project">案件名</label>
      <input type="text" id="f-project" placeholder="例：〇〇橋梁点検業務">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-date">飛行日</label>
        <input type="date" id="f-date">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-start">飛行開始時刻</label>
        <input type="time" id="f-start">
      </div>
      <div class="field">
        <label for="f-end">飛行終了時刻</label>
        <input type="time" id="f-end">
      </div>
    </div>

    <div class="field">
      <label for="f-location">飛行場所（住所）</label>
      <input type="text" id="f-location" placeholder="例：東京都千代田区丸の内1-1-1">
    </div>

    <div class="field">
      <label for="f-pilot">操縦者氏名</label>
      <input type="text" id="f-pilot" placeholder="例：山田 太郎">
    </div>

    <div class="field">
      <label for="f-aircraft">機体名</label>
      <input type="text" id="f-aircraft" placeholder="例：DJI Mavic 3 Enterprise">
      <div class="tpl-row">
        <select id="tpl-select" aria-label="機体テンプレートを選択">
          <option value="">機体テンプレートから選ぶ…</option>
        </select>
        <button type="button" class="btn-small" id="tpl-save">現在の機体を登録</button>
        <button type="button" class="btn-small danger" id="tpl-delete">削除</button>
      </div>
    </div>

    <div class="field">
      <label for="f-purpose">飛行目的</label>
      <input type="text" id="f-purpose" placeholder="例：構造物点検・空中撮影">
    </div>

    <div class="field">
      <label for="f-notes">備考</label>
      <textarea id="f-notes" placeholder="特記事項・注意事項など（任意）"></textarea>
      <button type="button" class="btn-small" id="btn-insert-calc" style="margin-top:6px;">📋 飛行計算の結果を備考に挿入</button>
    </div>

    <button class="btn-print" onclick="window.print()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      印刷 ／ PDF出力
    </button>

    <div class="btn-secondary-row">
      <button type="button" class="btn-outline" id="btn-json-save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        JSON保存
      </button>
      <button type="button" class="btn-outline" id="btn-json-load">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        JSON読込
      </button>
      <input type="file" id="json-file" accept=".json,application/json">
    </div>

    <button type="button" class="btn-next" id="btn-to-checklist">
      この計画で飛行前チェックリストへ進む
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <p class="autosave-note" id="autosave-note">入力内容はこのブラウザに自動保存されます</p>
  </section>

  <section class="preview-panel">
    <div class="preview-panel-label">プレビュー（リアルタイム更新）</div>

    <div class="doc" id="doc">

      <div class="doc-header">
        <div class="doc-title">ド ロ ー ン 飛 行 計 画 書</div>
        <div class="doc-subtitle">Drone Flight Plan</div>
        <div class="doc-project" id="p-project">（案件名未入力）</div>
      </div>

      <div class="doc-section-title">■ 飛行概要</div>
      <table class="doc-table">
        <tr>
          <th>飛行日</th>
          <td id="p-date" class="empty">―</td>
        </tr>
        <tr>
          <th>飛行時間</th>
          <td id="p-time" class="empty">―</td>
        </tr>
        <tr>
          <th>飛行場所（住所）</th>
          <td id="p-location" class="empty">―</td>
        </tr>
      </table>

      <div class="doc-section-title">■ 機体・操縦者情報</div>
      <table class="doc-table">
        <tr>
          <th>操縦者氏名</th>
          <td id="p-pilot" class="empty">―</td>
        </tr>
        <tr>
          <th>機体名</th>
          <td id="p-aircraft" class="empty">―</td>
        </tr>
        <tr>
          <th>飛行目的</th>
          <td id="p-purpose" class="empty">―</td>
        </tr>
      </table>

      <div class="doc-section-title">■ 備考</div>
      <table class="doc-table">
        <tr>
          <th>備考・特記事項</th>
          <td id="p-notes" class="empty" style="min-height:60px;white-space:pre-wrap;">―</td>
        </tr>
      </table>

      <div class="doc-footer">
        <div id="p-issued">作成日：</div>
        <div class="sign-area">
          <div class="sign-box">
            <span class="sign-label">作成者</span>
            <div class="sign-line"></div>
          </div>
          <div class="sign-box">
            <span class="sign-label">確認者</span>
            <div class="sign-line"></div>
          </div>
        </div>
      </div>

    </div></section>

</div><script>
  const fields = [
    { input: 'f-project',  preview: 'p-project',  format: v => v || null },
    { input: 'f-date',     preview: 'p-date',     format: formatDate },
    { input: 'f-start',    preview: null,          format: null },
    { input: 'f-end',      preview: null,          format: null },
    { input: 'f-location', preview: 'p-location', format: v => v || null },
    { input: 'f-pilot',    preview: 'p-pilot',    format: v => v || null },
    { input: 'f-aircraft', preview: 'p-aircraft', format: v => v || null },
    { input: 'f-purpose',  preview: 'p-purpose',  format: v => v || null },
    { input: 'f-notes',    preview: 'p-notes',    format: v => v || null },
  ];

  function formatDate(v) {
    if (!v) return null;
    const [y, m, d] = v.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function formatTime(v) {
    if (!v) return null;
    const [h, m] = v.split(':');
    return `${h}:${m}`;
  }

  function setPreview(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '―';
      el.classList.add('empty');
    }
  }

  function update() {
    fields.forEach(({ input, preview, format }) => {
      if (!preview) return;
      const val = document.getElementById(input).value.trim();
      setPreview(preview, format(val));
    });

    const proj = document.getElementById('f-project').value.trim();
    const pProj = document.getElementById('p-project');
    pProj.textContent = proj || '（案件名未入力）';

    const start = formatTime(document.getElementById('f-start').value);
    const end   = formatTime(document.getElementById('f-end').value);
    let timeStr = null;
    if (start && end)   timeStr = `${start} 〜 ${end}`;
    else if (start)     timeStr = `${start} 〜`;
    else if (end)       timeStr = `〜 ${end}`;
    setPreview('p-time', timeStr);

    const now = new Date();
    document.getElementById('p-issued').textContent =
      `作成日：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  }

  // ===== 自動保存（下書き） =====
  const DRAFT_KEY   = 'drone-flight-plan-draft';
  const TPL_KEY     = 'drone-aircraft-templates';
  const SESSION_KEY = 'drone-active-session';

  const FIELD_IDS = fields.map(f => f.input);

  function readPlan() {
    const plan = {};
    FIELD_IDS.forEach(id => plan[id.replace('f-', '')] = document.getElementById(id).value);
    return plan;
  }
  function fillPlan(plan) {
    FIELD_IDS.forEach(id => {
      const k = id.replace('f-', '');
      if (plan[k] !== undefined) document.getElementById(id).value = plan[k];
    });
  }
  function saveDraft() {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(readPlan()));
  }
  function loadDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if (d) fillPlan(d);
    } catch (e) {}
  }

  // ===== 機体テンプレート =====
  // 飛行計算ページの機体プリセット（内蔵+ユーザー保存）の名前も統合表示する
  const CALC_PRESET_KEY = 'drone-aircraft-presets-v2';
  function loadCalcPresetNames() {
    let names = ['DJI Air 2S', 'DJI Air 3', 'DJI Air 3S', 'DJI AGRAS T70P', 'DJI Avata 2', 'DJI Avata 360', 'DJI Flip', 'DJI FPV', 'DJI Inspire 2', 'DJI Inspire 3', 'DJI Lito', 'DJI Matrice 350 RTK', 'DJI Mavic Pro', 'DJI Mavic 2 Pro', 'DJI Mavic 3', 'DJI Mavic 3 Cine', 'DJI Mavic 3 Classic', 'DJI Mavic 3 Zoom', 'DJI Mavic 3 Pro', 'DJI Mavic 4 Pro', 'DJI Mavic Air', 'DJI Mavic Air 2', 'DJI Mini 2', 'DJI Mini 2 SE', 'DJI Mini 3', 'DJI Mini 3 Pro', 'DJI Mini 4 Pro', 'DJI Mini 4K', 'DJI Mini 5 Pro', 'DJI Neo', 'DJI Neo 2', 'DJI Phantom 4 Pro', 'DJI Phantom 4 Pro V2.0'];
    try {
      const user = JSON.parse(localStorage.getItem(CALC_PRESET_KEY)) || [];
      names = [...user.map(p => p.name), ...names];
    } catch (e) {}
    return names;
  }
  function loadTemplates() {
    let list = [];
    try { list = JSON.parse(localStorage.getItem(TPL_KEY)) || []; }
    catch (e) {}
    // 計算ページ由来の機体名を統合（重複除去）
    loadCalcPresetNames().forEach(n => { if (!list.includes(n)) list.push(n); });
    return list;
  }
  function renderTemplates() {
    const sel = document.getElementById('tpl-select');
    const list = loadTemplates();
    sel.innerHTML = '<option value="">機体テンプレートから選ぶ…</option>' +
      list.map(t => `<option value="${t.replace(/"/g, '&quot;')}"></option>`).join('');
    // option のテキストも設定（value のみだと表示されないブラウザ対策）
    [...sel.options].forEach((o, i) => { if (i > 0) o.textContent = list[i - 1]; });
  }
  document.getElementById('tpl-select').addEventListener('change', e => {
    if (!e.target.value) return;
    document.getElementById('f-aircraft').value = e.target.value;
    update();
    saveDraft();
  });
  document.getElementById('tpl-save').addEventListener('click', () => {
    const name = document.getElementById('f-aircraft').value.trim();
    if (!name) { alert('機体名を入力してから登録してください。'); return; }
    const list = loadTemplates();
    if (list.includes(name)) { alert('すでに登録されています。'); return; }
    list.push(name);
    localStorage.setItem(TPL_KEY, JSON.stringify(list));
    renderTemplates();
    document.getElementById('tpl-select').value = name;
  });
  document.getElementById('tpl-delete').addEventListener('click', () => {
    const sel = document.getElementById('tpl-select');
    if (!sel.value) { alert('削除するテンプレートを選択してください。'); return; }
    if (!confirm(`「${sel.value}」をテンプレートから削除しますか？`)) return;
    localStorage.setItem(TPL_KEY, JSON.stringify(loadTemplates().filter(t => t !== sel.value)));
    renderTemplates();
  });

  // ===== JSON 保存・読込 =====
  document.getElementById('btn-json-save').addEventListener('click', () => {
    const payload = { app: 'drone-flight-plan', savedAt: new Date().toISOString(), plan: readPlan() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const name = (readPlan().project || 'flight-plan').replace(/[\\/:*?"<>|]/g, '_');
    a.download = `${name}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('btn-json-load').addEventListener('click', () =>
    document.getElementById('json-file').click());
  document.getElementById('json-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const plan = parsed.plan || parsed;
        if (typeof plan !== 'object') throw new Error();
        fillPlan(plan);
        update();
        saveDraft();
      } catch (err) {
        alert('JSONファイルを読み込めませんでした。このツールで保存したファイルか確認してください。');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ===== 飛行計算結果の挿入 =====
  const CALC_SUMMARY_KEY = 'drone-calc-summary';
  document.getElementById('btn-insert-calc').addEventListener('click', () => {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(CALC_SUMMARY_KEY)); } catch (e) {}
    if (!s || !s.text) {
      alert('保存された計算結果がありません。\n先に「飛行計算」ページで計算し、「計算結果を計画書の備考へ送る」を押してください。');
      return;
    }
    const notes = document.getElementById('f-notes');
    notes.value = notes.value ? `${notes.value}\n\n${s.text}` : s.text;
    // 機体名が未入力なら計算時の機体を反映
    const ac = document.getElementById('f-aircraft');
    if (!ac.value.trim() && s.aircraft && !s.aircraft.startsWith('（')) ac.value = s.aircraft;
    update();
    saveDraft();
  });

  // ===== チェックリストへ進む（運用フロー） =====
  document.getElementById('btn-to-checklist').addEventListener('click', () => {
    const plan = readPlan();
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      createdAt: Date.now(),
      step: 'checklist',
      plan: plan
    }));
    location.href = 'checklist.html';
  });

  fields.forEach(({ input }) => {
    document.getElementById(input).addEventListener('input', () => {
      update();
      saveDraft();
    });
  });

  loadDraft();
  renderTemplates();
  update();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
