<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドローン運用ツール | 飛行計画書</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#25364A">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ===== ページ固有スタイル（共通部分は theme.css 参照） ===== */

    /* ===== レイアウト ===== */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: calc(100vh - 54px);
    }

    /* ===== フォームパネル ===== */
    .form-panel {
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 28px 28px 40px;
      overflow-y: auto;
    }
    .form-panel h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* 入力間隔はこのページのみ広め（長い1カラムフォームの視線移動を助ける） */
    .field { margin-bottom: 24px; }

    /* 機体入力行（複数機対応） */
    .ac-row {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .ac-row select { margin-bottom: 0; }
    .ac-pair {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 8px;
    }
    @media (max-width: 480px) {
      .ac-pair { grid-template-columns: 1fr; }
    }

    /* 特定飛行ボタン群 */
    .sp-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    /* データクリア */
    .btn-clear {
      margin-top: 10px;
      width: 100%;
      padding: 11px;
      background: transparent;
      color: var(--danger-dark);
      border: 2px solid var(--danger-dark);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-clear:hover { background: var(--danger-dark); color: #fff; }
    .btn-small {
      padding: 10px 14px;
      min-height: 44px;
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .btn-small:hover { background: var(--accent); color: #fff; }
    .btn-small.danger { color: #8a2f2f; border-color: #8a2f2f; }
    .btn-small.danger:hover { background: #8a2f2f; color: #fff; }

    /* 保存ステータス */
    .autosave-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }

    .btn-secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-outline {
      padding: 11px;
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .15s, color .15s;
    }
    .btn-outline:hover { background: var(--accent); color: #fff; }

    .btn-next {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      background: var(--accent-light);
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, color .15s;
    }
    .btn-next:hover { background: var(--accent); color: #fff; }
    #json-file { display: none; }

    .btn-print {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn-print:hover { background: #34495f; }
    .btn-print:active { transform: scale(.98); }

    /* ===== プレビューパネル ===== */
    .preview-panel {
      background: var(--bg);
      padding: 28px 28px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-panel-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 24px;
      align-self: flex-start;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    /* ===== 計画書本体 ===== */
    .doc {
      background: var(--white);
      width: 100%;
      max-width: 680px;
      padding: 40px 44px;
      box-shadow: 0 2px 16px rgba(0,0,0,.10);
      border-radius: 4px;
    }

    .doc-header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--accent);
    }
    .doc-header .doc-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
    }
    .doc-header .doc-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: .06em;
    }
    .doc-header .doc-project {
      font-size: 17px;
      font-weight: 700;
      margin-top: 14px;
      padding: 8px 16px;
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      text-align: left;
      color: var(--text);
      min-height: 36px;
    }

    .doc-section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--white);
      background: var(--accent);
      padding: 5px 12px;
      margin: 24px 0 0;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }
    .doc-table tr { border-bottom: 1px solid var(--border); }
    .doc-table tr:last-child { border-bottom: 2px solid var(--accent); }
    .doc-table th {
      width: 38%;
      padding: 9px 12px;
      background: var(--accent-light);
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      vertical-align: top;
      border-right: 2px solid var(--accent);
    }
    .doc-table td {
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      vertical-align: top;
      min-height: 34px;
    }
    .doc-table td.empty { color: var(--muted); font-style: italic; }

    .doc-footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 11px;
      color: var(--muted);
    }
    .doc-footer .sign-area {
      display: flex;
      gap: 32px;
    }
    .doc-footer .sign-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .doc-footer .sign-label { font-size: 11px; color: var(--muted); }
    .doc-footer .sign-line {
      width: 100px;
      height: 1px;
      background: var(--border);
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .form-panel {
        border-right: none;
        border-bottom: 2px solid var(--border);
        padding: 20px 16px 28px;
      }
      .preview-panel {
        padding: 20px 10px 32px;
      }
      .doc {
        padding: 24px 18px;
      }
      .field-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .form-panel {
        padding: 16px 12px 24px;
      }
    }

    /* ===== 印刷 ===== */
    @media print {
      @page {
        size: A4 portrait;
        /* 余白を0にするとブラウザのヘッダー/フッター（URL・日付・ページ番号）の
           描画場所がなくなり、印刷設定に関係なく消える。
           実際の余白は .doc 側の padding(mm) で確保する */
        margin: 0;
      }

      /* 「背景のグラフィック」設定がオフでも背景色・罫線色を強制的に印刷する */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body { background: #fff; font-size: 12px; }
      .site-header,
      .form-panel,
      .preview-panel-label { display: none !important; }

      .layout { display: block; }

      .preview-panel {
        background: #fff;
        padding: 0;
        overflow: visible;
        display: block;
      }

      .doc {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
        width: 100%;
        /* @page margin:0 のぶんの紙余白をここで確保 */
        padding: 18mm 16mm 20mm;
        /* ページ途中での不自然な分割やサイン欄だけの孤立を防ぐ */
        break-inside: avoid;
      }

      .doc-table {
        /* 各テーブル単位でも改ページを制限 */
        break-inside: avoid;
      }

      .doc-header .doc-title { font-size: 20px; }
      .doc-header .doc-project { font-size: 15px; }

      .doc-table th,
      .doc-table td { font-size: 11px; padding: 7px 10px; }

      /* 万一背景色が印刷されない環境でも見出しセルと値セルの
         区別がつくよう、罫線による保険を掛けておく */
      .doc-table th { border-right: 1.5px solid var(--accent); }

      .btn-print { display: none !important; }
    }
  </style>
</head>
<body>

<header class="site-header">
</header>

<nav class="site-nav" aria-label="ツール間ナビゲーション">
  <a href="index.html">ホーム</a>
  <a href="aircraft.html">機体管理</a>
  <a href="flight-plan.html" aria-current="page">計画書</a>
  <a href="checklist.html">チェックリスト</a>
  <a href="flight-log.html">日誌</a>
  <a href="data.html">データ管理</a>
  <a href="calculator.html">飛行計算</a>

<div class="layout">

  <section class="form-panel">

    <div class="field">
      <label for="f-project">案件名</label>
      <input type="text" id="f-project" placeholder="例：〇〇橋梁点検業務">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-date">飛行日</label>
        <input type="date" id="f-date">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-start">飛行開始時刻</label>
        <input type="time" id="f-start">
      </div>
      <div class="field">
        <label for="f-end">飛行終了時刻</label>
        <input type="time" id="f-end">
      </div>
    </div>

    <div class="field">
      <label for="f-location">飛行場所（住所）</label>
      <input type="text" id="f-location" placeholder="例：東京都千代田区丸の内1-1-1">
    </div>

    <div class="field">
      <label for="f-pilot">操縦者氏名</label>
      <select id="f-pilot" aria-label="操縦者氏名（登録から選択または手入力）"></select>
      <div class="hint">機体管理の登録から選択、または「＋手入力…」で直接入力できます。</div>
    </div>

    <div class="field">
      <label>機体（最大5機）</label>
      <div id="aircraft-rows"></div>
      <div class="hint">各行で機体管理の登録から選択、または「＋手入力…」で直接入力できます。1機入力すると次の欄が現れます。</div>
    </div>

    <div class="field">
      <label for="f-purpose">飛行目的</label>
      <input type="text" id="f-purpose" placeholder="例：構造物点検・空中撮影">
    </div>

    <div class="field">
      <label for="f-notes">備考</label>
      <div class="sp-btns" aria-label="特定飛行を備考に追記">
        <button type="button" class="btn-small sp-btn" data-sp="night">＋夜間</button>
        <button type="button" class="btn-small sp-btn" data-sp="bvlos">＋目視外</button>
        <button type="button" class="btn-small sp-btn" data-sp="heavy">＋25kg以上</button>
        <button type="button" class="btn-small sp-btn" data-sp="drop">＋物件投下</button>
      </div>
      <textarea id="f-notes" placeholder="特記事項・注意事項など（任意）"></textarea>
      <button type="button" class="btn-small" id="btn-insert-calc" style="margin-top:6px;">📋 飛行計算の結果を備考に挿入</button>
    </div>

    <button class="btn-print" onclick="window.print()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      印刷 ／ PDF出力
    </button>

    <div class="btn-secondary-row">
      <button type="button" class="btn-outline" id="btn-json-save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        JSON保存
      </button>
      <button type="button" class="btn-outline" id="btn-json-load">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        JSON読込
      </button>
      <input type="file" id="json-file" accept=".json,application/json">
    </div>

    <button type="button" class="btn-clear" id="btn-clear">データクリア（入力と保存データを消去）</button>

    <button type="button" class="btn-next" id="btn-to-checklist">
      この計画で飛行前チェックリストへ進む
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <p class="autosave-note" id="autosave-note">入力内容はこのブラウザに自動保存されます</p>
  </section>

  <section class="preview-panel">
    <div class="preview-panel-label">プレビュー（リアルタイム更新）</div>

    <div class="doc" id="doc">

      <div class="doc-header">
        <div class="doc-title">ド ロ ー ン 飛 行 計 画 書</div>
        <div class="doc-subtitle">Drone Flight Plan</div>
        <div class="doc-project" id="p-project">（案件名未入力）</div>
      </div>

      <div class="doc-section-title">■ 飛行概要</div>
      <table class="doc-table">
        <tr>
          <th>飛行日</th>
          <td id="p-date" class="empty">―</td>
        </tr>
        <tr>
          <th>飛行時間</th>
          <td id="p-time" class="empty">―</td>
        </tr>
        <tr>
          <th>飛行場所（住所）</th>
          <td id="p-location" class="empty">―</td>
        </tr>
      </table>

      <div class="doc-section-title">■ 機体・操縦者情報</div>
      <table class="doc-table">
        <tr>
          <th>操縦者氏名</th>
          <td id="p-pilot" class="empty">―</td>
        </tr>
        <tr>
          <th>機体（機体番号）</th>
          <td id="p-aircraft" class="empty" style="white-space:pre-wrap;">―</td>
        </tr>
        <tr>
          <th>飛行目的</th>
          <td id="p-purpose" class="empty">―</td>
        </tr>
      </table>

      <div class="doc-section-title">■ 備考</div>
      <table class="doc-table">
        <tr>
          <th>備考・特記事項</th>
          <td id="p-notes" class="empty" style="min-height:60px;white-space:pre-wrap;">―</td>
        </tr>
      </table>

      <div class="doc-footer">
        <div id="p-issued">作成日：</div>
        <div class="sign-area">
          <div class="sign-box">
            <span class="sign-label">作成者</span>
            <div class="sign-line"></div>
          </div>
          <div class="sign-box">
            <span class="sign-label">確認者</span>
            <div class="sign-line"></div>
          </div>
        </div>
      </div>

    </div></section>

</div><script>
  const fields = [
    { input: 'f-project',  preview: 'p-project',  format: v => v || null },
    { input: 'f-date',     preview: 'p-date',     format: formatDate },
    { input: 'f-start',    preview: null,          format: null },
    { input: 'f-end',      preview: null,          format: null },
    { input: 'f-location', preview: 'p-location', format: v => v || null },
    { input: 'f-pilot',    preview: 'p-pilot',    format: v => v || null },
    { input: 'f-purpose',  preview: 'p-purpose',  format: v => v || null },
    { input: 'f-notes',    preview: 'p-notes',    format: v => v || null },
  ];

  function formatDate(v) {
    if (!v) return null;
    const [y, m, d] = v.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function formatTime(v) {
    if (!v) return null;
    const [h, m] = v.split(':');
    return `${h}:${m}`;
  }

  function setPreview(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '―';
      el.classList.add('empty');
    }
  }

  function update() {
    fields.forEach(({ input, preview, format }) => {
      if (!preview) return;
      const val = document.getElementById(input).value.trim();
      setPreview(preview, format(val));
    });

    const proj = document.getElementById('f-project').value.trim();
    const pProj = document.getElementById('p-project');
    pProj.textContent = proj || '（案件名未入力）';

    const start = formatTime(document.getElementById('f-start').value);
    const end   = formatTime(document.getElementById('f-end').value);
    let timeStr = null;
    if (start && end)   timeStr = `${start} 〜 ${end}`;
    else if (start)     timeStr = `${start} 〜`;
    else if (end)       timeStr = `〜 ${end}`;
    setPreview('p-time', timeStr);

    // 機体プレビュー（複数機・JU番号付き）
    const acs = readAircrafts();
    setPreview('p-aircraft', acs.length
      ? acs.map(a => a.regNo ? `${a.name}（${a.regNo}）` : (a.name || `（JU番号のみ：${a.regNo}）`)).join('\n')
      : null);

    const now = new Date();
    document.getElementById('p-issued').textContent =
      `作成日：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  }

  // ===== 自動保存（下書き） =====
  const DRAFT_KEY   = 'drone-flight-plan-draft';
  const SESSION_KEY = 'drone-active-session';

  const FIELD_IDS = fields.map(f => f.input);

  function readAircrafts() {
    return [...document.querySelectorAll('#aircraft-rows .ac-row')].map(row => {
      const nv = row.querySelector('.ac-name').value;
      return {
        name: (nv === MANUAL ? '' : nv).trim(),
        regNo: row.querySelector('.ac-reg').value.trim(),
      };
    }).filter(a => a.name || a.regNo);
  }
  function readPlan() {
    const plan = {};
    FIELD_IDS.forEach(id => {
      const v = document.getElementById(id).value;
      plan[id.replace('f-', '')] = (v === MANUAL ? '' : v);
    });
    const acs = readAircrafts();
    plan.aircrafts = acs;
    // 旧スキーマ互換: 機体名の連結文字列も保持（チェックリスト・日誌への引き継ぎ、旧JSON互換）
    plan.aircraft = acs.map(a => a.name).filter(Boolean).join(' / ');
    return plan;
  }
  function fillPlan(plan) {
    FIELD_IDS.forEach(id => {
      const k = id.replace('f-', '');
      if (plan[k] !== undefined) document.getElementById(id).value = plan[k];
    });
    let acs = Array.isArray(plan.aircrafts) ? plan.aircrafts : null;
    if (!acs && typeof plan.aircraft === 'string' && plan.aircraft.trim()) {
      // 旧形式（機体名の文字列）からの復元
      acs = plan.aircraft.split(' / ').map(n => ({ name: n.trim(), regNo: '' }));
    }
    if (acs) {
      document.querySelectorAll('#aircraft-rows .ac-row').forEach((row, i) => {
        const sel = row.querySelector('.ac-name');
        const nm = (acs[i] && acs[i].name) || '';
        if (nm) ensureOption(sel, nm); else sel.value = '';
        row.querySelector('.ac-reg').value = (acs[i] && acs[i].regNo) || '';
      });
      updateRowVisibility();
    }
    // 操縦者（単一select）
    if (plan.pilot) ensureOption(document.getElementById('f-pilot'), plan.pilot);
    else document.getElementById('f-pilot').value = '';
  }
  function saveDraft() {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(readPlan()));
  }
  function loadDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if (d) fillPlan(d);
    } catch (e) {}
  }

  // ===== 機体管理タブの登録内容から選択 =====
  const AIRCRAFT_KEY = 'drone-aircraft-list';
  const MAX_AIRCRAFT = 5;

  function loadAircraftList() {
    try { return JSON.parse(localStorage.getItem(AIRCRAFT_KEY)) || []; }
    catch (e) { return []; }
  }
  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // ===== 選択／自由入力の統一コントロール（飛行日誌の[機体]欄と同仕様） =====
  const MANUAL = '__manual__';
  function buildOptions(values, label) {
    const uniq = [...new Set(values.map(v => (v || '').trim()).filter(Boolean))];
    let html = `<option value="">（${label}を選択）</option>`;
    uniq.forEach(v => { html += `<option value="${escAttr(v)}">${escAttr(v)}</option>`; });
    html += `<option value="${MANUAL}">＋手入力…</option>`;
    return html;
  }
  function ensureOption(sel, value) {
    if (![...sel.options].some(o => o.value === value)) {
      const o = document.createElement('option');
      o.value = o.textContent = value;
      sel.insertBefore(o, sel.lastElementChild);
    }
    sel.value = value;
  }

  function buildAircraftRows() {
    const wrap = document.getElementById('aircraft-rows');
    const regs = loadAircraftList();
    const options = buildOptions(regs.map(a => a.name), '機体');
    wrap.innerHTML = '';
    for (let i = 0; i < MAX_AIRCRAFT; i++) {
      const row = document.createElement('div');
      row.className = 'ac-row';
      row.innerHTML = `
        <div class="ac-pair">
          <select class="ac-name" aria-label="機体${i + 1}（登録から選択または手入力）">${options}</select>
          <input type="text" class="ac-reg" placeholder="JU番号" aria-label="機体${i + 1}の機体番号">
        </div>`;
      wrap.appendChild(row);
    }

    wrap.addEventListener('change', e => {
      if (!e.target.classList.contains('ac-name')) return;
      const sel = e.target;
      if (sel.value === MANUAL) {
        const v = (prompt('機体名を入力してください') || '').trim();
        if (v) ensureOption(sel, v); else sel.value = '';
      } else if (sel.value) {
        // 登録機体を選んだらJU番号を自動補完（空欄時のみ）
        const reg = loadAircraftList().find(a => a.name === sel.value);
        const regInput = sel.closest('.ac-row').querySelector('.ac-reg');
        if (reg && reg.regNo && !regInput.value.trim()) regInput.value = reg.regNo;
      }
      updateRowVisibility();
      update();
      saveDraft();
    });
    wrap.addEventListener('input', e => {
      if (!e.target.matches('.ac-reg')) return;
      updateRowVisibility();
      update();
      saveDraft();
    });
  }

  // 1機入力すると次の行が現れる（最大5機）
  function updateRowVisibility() {
    const rows = [...document.querySelectorAll('#aircraft-rows .ac-row')];
    let visible = 1;
    rows.forEach((row, i) => {
      const nv = row.querySelector('.ac-name').value;
      const filled = (nv && nv !== MANUAL) || row.querySelector('.ac-reg').value.trim();
      if (filled) visible = Math.min(i + 2, MAX_AIRCRAFT);
    });
    rows.forEach((row, i) => { row.style.display = i < visible ? '' : 'none'; });
  }

  // 操縦者（単一select：機体管理の担当操縦者から選択または手入力）
  function buildPilotSelect() {
    const sel = document.getElementById('f-pilot');
    const current = sel.value;
    const pilots = loadAircraftList().map(a => a.pilot);
    sel.innerHTML = buildOptions(pilots, '操縦者');
    if (current && current !== MANUAL) ensureOption(sel, current);
  }
  document.getElementById('f-pilot').addEventListener('change', e => {
    const sel = e.target;
    if (sel.value === MANUAL) {
      const v = (prompt('操縦者氏名を入力してください') || '').trim();
      if (v) ensureOption(sel, v); else sel.value = '';
    }
    update();
    saveDraft();
  });

  // ===== JSON 保存・読込 =====
  document.getElementById('btn-json-save').addEventListener('click', () => {
    const payload = { app: 'drone-flight-plan', savedAt: new Date().toISOString(), plan: readPlan() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const name = (readPlan().project || 'flight-plan').replace(/[\\/:*?"<>|]/g, '_');
    a.download = `${name}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('btn-json-load').addEventListener('click', () =>
    document.getElementById('json-file').click());
  document.getElementById('json-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const plan = parsed.plan || parsed;
        if (typeof plan !== 'object') throw new Error();
        fillPlan(plan);
        update();
        saveDraft();
      } catch (err) {
        alert('JSONファイルを読み込めませんでした。このツールで保存したファイルか確認してください。');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ===== 飛行計算結果の挿入 =====
  const CALC_SUMMARY_KEY = 'drone-calc-summary';
  document.getElementById('btn-insert-calc').addEventListener('click', () => {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(CALC_SUMMARY_KEY)); } catch (e) {}
    if (!s || !s.text) {
      alert('保存された計算結果がありません。\n先に「飛行計算」ページで計算し、「計算結果を計画書の備考へ送る」を押してください。');
      return;
    }
    const notes = document.getElementById('f-notes');
    notes.value = notes.value ? `${notes.value}\n\n${s.text}` : s.text;
    // 機体が未入力なら計算時の機体を1機目に反映
    const first = document.querySelector('#aircraft-rows .ac-name');
    if (first && (!first.value || first.value === MANUAL) && s.aircraft && !s.aircraft.startsWith('（')) {
      ensureOption(first, s.aircraft);
      updateRowVisibility();
    }
    update();
    saveDraft();
  });

  // ===== チェックリストへ進む（運用フロー） =====
  document.getElementById('btn-to-checklist').addEventListener('click', () => {
    const plan = readPlan();
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      createdAt: Date.now(),
      step: 'checklist',
      plan: plan
    }));
    location.href = 'checklist.html';
  });

  // ===== 特定飛行ボタン（備考へ追記。トグルではない＝複数同時成立し得るため） =====
  const SP_TEXT = {
    night: '【特定飛行】夜間飛行',
    bvlos: '【特定飛行】目視外飛行',
    heavy: '【特定飛行】最大離陸重量25kg以上の機体の飛行',
    drop:  '【特定飛行】物件投下',
  };
  document.querySelectorAll('.sp-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const notes = document.getElementById('f-notes');
      const t = SP_TEXT[btn.dataset.sp];
      notes.value = notes.value ? `${notes.value}\n${t}` : t;
      update();
      saveDraft();
    });
  });

  // ===== データクリア =====
  document.getElementById('btn-clear').addEventListener('click', () => {
    if (!confirm('計画書の入力内容と保存データをクリアしますか？\nこの操作は取り消せません。')) return;
    FIELD_IDS.forEach(id => document.getElementById(id).value = '');
    document.querySelectorAll('#aircraft-rows .ac-reg').forEach(i => i.value = '');
    document.querySelectorAll('#aircraft-rows .ac-name').forEach(s => s.value = '');
    localStorage.removeItem(DRAFT_KEY);
    updateRowVisibility();
    update();
  });

  fields.forEach(({ input }) => {
    document.getElementById(input).addEventListener('input', () => {
      update();
      saveDraft();
    });
  });

  buildAircraftRows();
  buildPilotSelect();
  loadDraft();
  updateRowVisibility();
  update();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
