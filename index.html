<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドローン運用ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #25364A;
      --accent-light: #EEF2E4;
      --border: #C8CEC0;
      --text: #2D3325;
      --muted: #72786B;
      --bg: #F5F3EC;
      --white: #ffffff;
      --radius: 8px;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== ヘッダー ===== */
    .site-header {
      background: var(--accent);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header svg { flex-shrink: 0; }
    .site-header h1 { font-size: 18px; font-weight: 700; letter-spacing: .03em; }

    /* ===== コンテナ ===== */
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    /* ===== 説明文 ===== */
    .page-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .page-desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.7;
    }

    /* ===== ツールカード一覧 ===== */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ===== カード ===== */
    .tool-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: background .18s, border-color .18s, box-shadow .18s, transform .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-card:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(37, 54, 74, .12);
      transform: translateY(-2px);
    }
    .tool-card:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(37, 54, 74, .10);
    }

    /* カードアイコン */
    .card-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s;
    }
    .tool-card:hover .card-icon {
      background: var(--white);
    }

    /* カードテキスト */
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .card-desc {
      display: block;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* 矢印 */
    .card-arrow {
      flex-shrink: 0;
      color: var(--border);
      transition: color .18s, transform .18s;
    }
    .tool-card:hover .card-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 480px) {
      .site-header { padding: 12px 16px; }
      .site-header h1 { font-size: 16px; }
      .container { padding: 24px 12px 56px; }
      .tool-card { padding: 16px 14px; gap: 14px; }
      .card-icon { width: 40px; height: 40px; }
      .card-title { font-size: 15px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
    <line x1="19.07" y1="4.93" x2="16.24" y2="7.76"/>
    <line x1="7.76" y1="16.24" x2="4.93" y2="19.07"/>
  </svg>
  <h1>ドローン運用ツール</h1>
</header>

<div class="container">

  <div class="page-label">Drone Operations Tools</div>
  <p class="page-desc">ドローンの安全な運用を支援するツール集です。<br>飛行計画の作成から直前の確認まで、現場でご活用ください。</p>

  <div class="tool-list">

    <!-- 飛行計画書 -->
    <a class="tool-card" href="flight-plan.html">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#25364A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <div class="card-body">
        <span class="card-title">飛行計画書</span>
        <span class="card-desc">飛行内容を入力してPDFの飛行計画書を作成</span>
      </div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <!-- 飛行前チェックリスト -->
    <a class="tool-card" href="checklist.html">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#25364A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <div class="card-body">
        <span class="card-title">飛行前チェックリスト</span>
        <span class="card-desc">飛行前の確認項目をチェック。状態は自動保存</span>
      </div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

  </div><!-- /.tool-list -->

</div><!-- /.container -->

</body>
</html>
